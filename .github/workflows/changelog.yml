name: Update changelog

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*']

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Generate changelog
        run: uv run git-cliff --output CHANGELOG.md

      - name: Open changelog pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/update-changelog
          base: main
          delete-branch: true
          title: "docs: update changelog"
          commit-message: "docs: update changelog"
          body: |
            Updates CHANGELOG.md from the current git history and tags.

            This workflow opens a pull request instead of pushing to main so branch protection can remain enabled.
